<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>le corner's word generator</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    text-align: center;
    padding: 2em;
    background: #f5f5f5;
  }
  input, button {
    font-size: 1.2em;
    padding: 0.5em 1em;
    margin: 0.3em;
  }
  #output {
    margin-top: 1em;
    font-size: 2em;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1><a href="https://www.tiktok.com/@le.corner.coder?_t=ZS-90lAWldo0Kl&_r=1">le corner's</a> word generator!</h1>
<p>Type a pattern (use <b>C</b> for consonant, <b>V</b> for vowel):</p>

<input id="pattern" placeholder="e.g. CVCVCC" value="CCVCV">
<button onclick="generateWord()">Generate</button>

<div id="output"></div>

<script>
const vowels = 'aeiou';
const consonants = 'bcdfghjklmnpqrstvwxyz';

function randomChar(set) {
  return set[Math.floor(Math.random() * set.length)];
}

function generateWord() {
  const pattern = document.getElementById('pattern').value.toUpperCase();
  let result = '';

  for (let char of pattern) {
    if (char === 'C') result += randomChar(consonants);
    else if (char === 'V') result += randomChar(vowels);
    else result += char; // keep other characters like '-' or ' '
  }

  document.getElementById('output').textContent = result;
}
</script>

</body>
</html>
